<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>切り抜きアカウント管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#14121F; --side:#191733; --side-hi:#2A2750; --bg:#F0EFF6; --card:#fff; --field:#EFEEF6;
  --accent:#E5386D; --ok:#1F8A4C; --danger:#D12F2F; --sub:#3A3750; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;font-size:16px;color:var(--ink);background:var(--bg);line-height:1.6}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none;padding:0}
a{color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:0;border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
textarea{min-height:84px;resize:vertical}
input[type=color]{height:44px;padding:4px;cursor:pointer}
h1,h2,h3{margin:0}

/* layout */
#app{display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--side);color:#fff;display:flex;flex-direction:column;padding:22px 14px;z-index:30;transition:transform .2s}
.brand{font-weight:900;font-size:21px;padding:6px 12px 24px;line-height:1.35}
.brand small{display:block;font-weight:500;font-size:13px;color:#DAD7F2;margin-top:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;color:#EEECFC;margin-bottom:4px}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--accent);color:#fff;font-weight:700}
.side-foot{margin-top:auto}
.side-foot button{width:100%;text-align:left;padding:10px 14px;border-radius:12px;color:#DAD7F2;font-size:14px}
.side-foot button:hover{background:var(--side-hi)}
.main{margin-left:236px;flex:1;padding:34px 38px 70px;min-width:0}
.topbar{display:none}
.bd{display:none}

.ph{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:30px;font-weight:900}
.phr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:999px;font-weight:700;background:var(--ink);color:#fff;white-space:nowrap}
.btn.pri{background:var(--accent)}
.btn.ghost{background:var(--field);color:var(--ink)}
.btn.danger{background:#FBE3E3;color:var(--danger)}
.btn.del{background:var(--danger);color:#fff}
.btn.sm{padding:6px 14px;font-size:14.5px}
.tabs{display:inline-flex;background:#fff;border-radius:999px;padding:4px}
.tabs button{padding:8px 18px;border-radius:999px;font-weight:700}
.tabs button.on{background:var(--ink);color:#fff}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.filters select{width:auto;min-width:150px;background:#fff}
.filters label.chk{display:flex;align-items:center;gap:8px;font-weight:700;background:#fff;padding:10px 14px;border-radius:10px}
.filters label.chk input{width:auto}
.count{font-weight:700}
.empty{background:#fff;border-radius:var(--radius);padding:36px 20px;text-align:center;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.lg{width:18px;height:18px}
.sub{color:var(--sub);font-size:14.5px}

/* account cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px}
.acard{background:#fff;border-radius:var(--radius);padding:24px 22px 20px;text-align:left;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:190px;transition:transform .12s}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--c)}
.acard:hover{transform:translateY(-2px)}
.aplat{font-weight:700;color:var(--sub)}
.aname{font-size:23px;font-weight:900;line-height:1.3;word-break:break-all}
.ahandle{font-weight:500;word-break:break-all}
.aprof{margin-top:4px;font-size:15px}
.miss{display:inline-block;align-self:flex-start;margin-top:auto;background:#FFE9C2;color:#7A3F00;font-weight:700;border-radius:999px;padding:3px 12px;font-size:14px}
.okmark{margin-top:auto;font-weight:700;color:var(--ok);font-size:14px}

/* video list */
.tbl{display:flex;flex-direction:column;gap:10px}
.vcard{background:#fff;border-radius:14px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;border-left:5px solid var(--acc,#888);transition:transform .1s,box-shadow .1s}
.vcard:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(20,18,40,.1)}
.vcard.late{background:#FFF5F5}
.vthumb{width:80px;height:80px;border-radius:10px;object-fit:cover;flex:none;background:#E6E4F2}
.vthumb-ph{width:80px;height:80px;border-radius:10px;background:var(--field);flex:none;display:grid;place-items:center;font-size:26px;color:#C0BCD6}
.vleft{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.vtitle{font-size:18px;font-weight:900;word-break:break-word;line-height:1.35}
.vmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.vtag{background:var(--field);border-radius:999px;padding:3px 12px;font-weight:700;font-size:13.5px}
.vright{display:flex;flex-direction:column;align-items:flex-end;gap:10px;flex:none}
.istats{display:flex;gap:18px}
.istat{text-align:right}
.istat b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.istat small{font-size:12px;color:var(--sub);font-weight:700}
.warnic{color:#C2410C;font-size:20px;cursor:help}
.wtxt{display:none;color:#C2410C;font-weight:700;font-size:14px}
.st{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.ins{padding:6px 12px;border-radius:999px;font-weight:700;background:#F3F2F8;color:#B4B1C4;white-space:nowrap}
.ins:hover{background:#E8E6F3}
.ins.done{background:#DDF3E5;color:var(--ok)}
.ins.late{background:#FFDADA;color:var(--danger)}
@media(max-width:860px){.vcard{flex-wrap:wrap}.vright{flex-direction:row;align-items:center;width:100%;justify-content:space-between}.istats{gap:12px}.istat b{font-size:16px}}

/* calendar */
.cal{background:#fff;border-radius:var(--radius);padding:16px}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.cal-title{font-size:24px;font-weight:900;min-width:150px;text-align:center}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{text-align:center;font-weight:700;padding:6px 0}
.dow div:first-child{color:#C0262D}.dow div:last-child{color:#1D5FC1}
.day{background:#F6F5FB;border-radius:10px;min-height:118px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.blank{background:transparent;cursor:default}
.day:not(.blank):hover{background:#EBE9F8}
.dnum{font-weight:700;font-size:14.5px;width:26px;height:26px;display:grid;place-items:center;flex:none}
.dnum.sun{color:#C0262D}.dnum.sat{color:#1D5FC1}
.day.today .dnum{background:var(--accent);color:#fff;border-radius:999px}
.chip{color:#fff;border-radius:6px;padding:2px 7px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.chip.dead{opacity:.5;text-decoration:line-through}
.more{font-size:13px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:14.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fchip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;background:#fff;font-weight:700}
.fchip.on{background:var(--ink);color:#fff}

/* list rows (links, popups) */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px}
.modal .lrow{background:var(--field)}
.lmain{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lmain.inline{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
.lmain b{font-weight:700;word-break:break-word}
.lurl{word-break:break-all;font-size:14.5px;font-weight:500}
.lbtn{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.lbtn a{text-decoration:none}
.sec{margin:28px 0 12px;font-size:21px;font-weight:900;display:flex;align-items:baseline;gap:10px}

/* insights table */
.ihead,.irow{display:grid;grid-template-columns:minmax(200px,1fr) 150px 150px 78px 78px 78px 78px 96px 100px;gap:10px;align-items:center;padding:14px 18px}
.ihead{font-weight:700;background:#E6E4F2;font-size:14.5px}
.irow{border-top:1px solid #EEEDF5;cursor:pointer}
.irow:hover{background:#F7F6FC}
.irow.late{background:#FFF0F0}
.latetxt{color:var(--danger);font-weight:700}
.donetxt{color:var(--ok);font-weight:700}
.summary{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:16px;font-weight:700}

/* modal */
.ov{position:fixed;inset:0;background:rgba(20,18,40,.58);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:100}
.ov.conf{z-index:200;align-items:center}
.modal{background:#fff;border-radius:18px;width:100%;max-width:660px;padding:26px;margin:auto 0}
.modal.wide{max-width:820px}
.modal.small{max-width:440px}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.mh h2{font-size:22px;font-weight:900}
.x{width:38px;height:38px;border-radius:50%;background:var(--field);font-size:18px;flex:none}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f>label,.lab{font-weight:700;font-size:15px}
.f .hint{font-size:14px;color:var(--sub)}
.fsec{grid-column:1/-1;font-weight:900;font-size:17px;margin-top:10px}
.mf{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap}
.mf.end{justify-content:flex-end}
.mf .grp{display:flex;gap:10px}
.cmsg{margin:4px 0 8px;font-size:17px;font-weight:500}
.pw{display:flex;gap:8px}
.pw button{flex:none;padding:0 14px;border-radius:10px;background:var(--field);font-weight:700}
.inline-actions{display:flex;gap:8px}
.inline-actions input{flex:1}
.segs{display:flex;flex-wrap:wrap;gap:8px}
.seg input{display:none}
.seg span{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;background:var(--field);font-weight:700;cursor:pointer}
.seg input:checked+span{background:var(--ink);color:#fff}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%}
.vinfo{background:var(--field);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:500}
.vinfo b{font-weight:900;font-size:18px}
.thumb-wrap{margin-bottom:16px}
.thumb-wrap img{width:100%;max-height:280px;object-fit:contain;border-radius:12px;background:#111;display:block}
.thumb-drop{border:2.5px dashed #C8C5E0;border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;font-weight:700;color:var(--sub);transition:background .15s}
.thumb-drop:hover,.thumb-drop.drag{background:#EBE9F8;border-color:var(--accent)}
.thumb-drop input{display:none}
.drow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.drow .f{flex:1;min-width:160px}
.dval{padding:10px 12px;background:var(--field);border-radius:10px;min-height:38px;word-break:break-word;white-space:pre-wrap}
.dlink{color:var(--accent);font-weight:700;text-decoration:none;word-break:break-all}
.dlink:hover{text-decoration:underline}

.rcard{background:#fff;border-bottom:1px solid #E6E4F2;padding:16px 20px;cursor:pointer}
.rcard:hover,.rcard:focus-visible{background:#F8F7FC;outline:2px solid var(--accent);outline-offset:-2px}
.rdate{font-size:14px;font-weight:800;color:var(--sub);margin-bottom:7px}
.rname{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:8px}
.rbody{min-width:0}
.rnum{display:flex;flex-direction:column;align-items:center;background:var(--field);border-radius:10px;padding:8px 14px;min-width:64px}
.rnum b{font-size:22px;font-weight:900;line-height:1}
.rnum small{font-size:12px;font-weight:700;color:var(--sub);margin-top:2px}
.rm-work{list-style:none;padding:0;margin:0}
.rm-work>li{padding:3px 0;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.rm-breakdown{list-style:none;padding:0 0 0 20px;margin:2px 0 4px;color:var(--sub)}
.rm-breakdown li{padding:1px 0}
.rmemo{font-size:13px;color:var(--sub);white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px}
.report-section{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px}
.report-section h2{font-size:18px;margin:0 0 14px}
.report-month{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.report-month strong{font-size:18px;min-width:125px;text-align:center}
.report-month button{width:40px;height:40px;border:1px solid #DCD9E9;border-radius:10px;background:#fff;cursor:pointer}
.report-month button:hover{background:var(--field)}
.report-goals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.report-goal{border:1px solid #E6E4F2;border-radius:10px;padding:15px;min-width:0}
.report-goal b{display:block;margin-bottom:8px}
.report-progress-track{height:12px;border-radius:12px;background:#ECEAF4;overflow:hidden;margin-top:12px}
.report-progress-fill{height:100%;background:var(--accent);border-radius:12px}
.report-goal-edit{border-top:1px solid #E6E4F2;margin-top:16px;padding-top:14px}
.report-goal-edit summary,.report-breakdown summary{cursor:pointer;color:var(--accent);font-weight:700;min-height:35px;list-style:revert}
.report-goal-edit form{margin-top:14px}
.report-goal-edit form>.btn{margin-top:14px}
.report-breakdown{margin-top:10px;font-size:14px}
.report-breakdown ul{list-style:none;margin:4px 0 0;padding:0}
.report-breakdown li{padding:4px 0;border-bottom:1px solid #F1F0F5}
.goal-editor-group{border:1px solid #E6E4F2;border-radius:10px;padding:14px;min-width:0}
.goal-editor-group>b{display:block;margin-bottom:12px}
.goal-editor-group .work-count-row input{width:100%;min-height:42px}
.goal-editor-group .sub{margin:8px 0;line-height:1.5}
.goal-editor-group .sub input{width:auto;min-height:0}
.goal-editor-total{border-top:1px solid #E6E4F2;padding-top:10px;margin-top:4px}
.report-goal-fields{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.report-goal-fields label{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;font-weight:700}
.report-goal-fields input{width:100%;min-height:44px;border:1px solid #C8C5D6;border-radius:8px;padding:8px}
.report-summary{display:flex;gap:22px;flex-wrap:wrap;margin:0}
.report-summary div{display:flex;gap:5px;align-items:baseline}
.report-summary dt{color:var(--sub)}
.report-summary dd{margin:0;font-weight:800}
@media(max-width:600px){.report-goals{grid-template-columns:1fr}.report-section{padding:16px}.rcard{padding:14px}}
.work-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.work-tag{display:inline-flex;align-items:center;gap:5px;background:var(--field);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:700}
.work-list{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.work-card{border:1px solid #DCD9E9;border-radius:12px;overflow:hidden;background:#fff}
.work-card.open{border-color:var(--accent)}
.work-head{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;font-weight:700;min-height:52px}
.work-head:hover{background:#F8F7FC}
.work-head input{width:20px;height:20px;min-width:20px;accent-color:var(--accent);padding:0;margin:0}
.work-arrow{margin-left:auto;color:var(--sub);transition:transform .15s}
.work-card.open .work-arrow{transform:rotate(90deg)}
.work-panel{display:none;border-top:1px solid #E6E4F2;padding:15px;background:#FAF9FD}
.work-card.open .work-panel{display:block}
.work-count-row{display:grid;grid-template-columns:minmax(80px,1fr) minmax(90px,130px) 28px;align-items:center;gap:10px;margin:0 0 10px;font-weight:700}
.work-count-row:last-child{margin-bottom:0}
.work-count-row input{text-align:right}
@media(max-width:480px){.work-head{padding:12px}.work-panel{padding:12px}.work-count-row{grid-template-columns:minmax(68px,1fr) minmax(70px,110px) 22px;gap:6px}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:300;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--danger)}

/* setup */
.setup{min-height:100vh;width:100%;background:var(--side);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px}
.setup-in{background:#fff;border-radius:20px;max-width:760px;width:100%;padding:34px}
.setup-in h1{font-size:28px;font-weight:900;margin-bottom:6px}
.setup-in ol{padding-left:22px;font-weight:500}
.setup-in ol li{margin-bottom:8px}
.setup-in pre{background:#14121F;color:#EDEBFA;border-radius:12px;padding:16px;font-size:12.5px;line-height:1.55;overflow:auto;max-height:260px;margin:0}
.errbox{background:#FFE3E3;color:#8E1B1B;font-weight:700;border-radius:12px;padding:12px 14px;margin:14px 0;white-space:pre-wrap;word-break:break-word}

@media (max-width:860px){
  .side{transform:translateX(-100%)}
  .side.open{transform:none}
  .bd.show{display:block;position:fixed;inset:0;background:rgba(20,18,40,.5);z-index:25}
  .main{margin-left:0;padding:0 14px 60px}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:20;font-weight:900;font-size:18px}
  .topbar button{width:44px;height:44px;border-radius:12px;background:#fff;font-size:20px}
  .ph h1{font-size:25px}
  .ihead{display:none}
  .irow{grid-template-columns:1fr;gap:6px}
  .irow>div[data-l]::before{content:attr(data-l) "：";font-weight:700}
  .c-warn{display:none}
  .wtxt{display:block}
  .day{min-height:68px;padding:3px}
  .chip{font-size:10.5px;padding:1px 4px}
  .more{font-size:10.5px}
  .dow,.days{gap:3px}
  .cal{padding:10px}
  .cal-title{font-size:19px;min-width:110px}
  .fgrid{grid-template-columns:1fr}
  .modal{padding:20px}
  .setup-in{padding:22px}
  .filters select{flex:1;min-width:130px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   定数
============================================================ */
const LS_URL = 'kirinuki_sb_url';
const LS_KEY = 'kirinuki_sb_key';
const STATUSES = ['編集中', '確認待ち', '投稿予定', '投稿予約', '投稿済'];
const STATUS_COLOR = {'編集中':'#D9822B','確認待ち':'#2B7FD9','投稿予定':'#0C8599','投稿予約':'#7B4BD6','投稿済':'#1F8A4C'};
const FIXED_CATS = ['渋スト', 'ASMR', '希空ch', 'その他'];
const DEFAULT_CATS = FIXED_CATS;
const INTERN_COLORS = ['#E5386D','#2B7FD9','#1F8A4C','#D9822B','#7B4BD6','#0C8599','#C2255C','#5C7CFA'];
const WD = ['日','月','火','水','木','金','土'];
const PAGES = [
  {id:'accounts', icon:'👤', label:'アカウント管理'},
  {id:'videos',   icon:'🎬', label:'動画・投稿管理'},

const modals = [];
function openModal(render, opts = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const m = document.createElement('div'); m.className = 'modal' + (opts.wide ? ' wide' : '');
  ov.appendChild(m); document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const obj = {ov, m, render, live: !!opts.live};
  m.innerHTML = render();
  let downOnOv = false;
  ov.addEventListener('mousedown', e => { downOnOv = e.target === ov; });
  ov.addEventListener('click', e => { if (e.target === ov && downOnOv) closeModal(obj); });
  modals.push(obj);
  return obj;
}
function closeModal(obj) {
  obj = obj || modals[modals.length - 1];
  if (!obj) return;
  const i = modals.indexOf(obj); if (i >= 0) modals.splice(i, 1);
  obj.ov.remove();
  if (!modals.length) document.body.style.overflow = '';
}
function refreshModals() { modals.forEach(o => { if (o.live) o.m.innerHTML = o.render(); }); }

function confirmDialog(msg, o = {}) {
  const {ok = '削除する', alertOnly = false} = o;
  return new Promise(res => {
    const ov = document.createElement('div'); ov.className = 'ov conf';
    ov.innerHTML = `<div class="modal small" role="alertdialog" aria-modal="true"><p class="cmsg">${esc(msg).replace(/\n/g, '<br>')}</p>
      <div class="mf end">${alertOnly ? '' : '<button class="btn ghost" data-r="0">キャンセル</button>'}
      <button class="btn ${alertOnly ? 'pri' : (o.danger === false ? 'pri' : 'del')}" data-r="1">${alertOnly ? 'OK' : esc(ok)}</button></div></div>`;
    document.body.appendChild(ov);
    const done = v => { document.removeEventListener('keydown', onKey, true); ov.remove(); res(v); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(b.dataset.r === '1'); });
    (ov.querySelector('[data-r="0"]') || ov.querySelector('[data-r="1"]')).focus();
  });
}

});

  if (e.key === 'Enter' && e.target.matches('[data-act][tabindex]')) { e.preventDefault(); e.target.click(); }

});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-submit]'); if (!f) return;

  try { await SUB[f.dataset.submit](Object.fromEntries(new FormData(f)), f); }

  ['name','platform','handle','profile_text','tendency','email','password','registered_date','account_url','ms_account','ms_birthdate','color'].forEach(k => rec[k] = nn(f[k]));
  rec.followers = numOrNull(f.followers);
  await q(db.from('accounts').update(rec).eq('id', form.dataset.id));
  closeModal(); await reload(['accounts']); toast('保存しました');
};

/* ============================================================
   ② 動画・投稿管理
============================================================ */
const allCategories = () => FIXED_CATS;
function filteredVideos() {
  const f = ui.vf;
  return S.videos.filter(v =>
    (!f.category || v.category === f.category) &&
    (!f.account || (f.account === 'none' ? !v.account_id : v.account_id === f.account)) &&
    (!f.status || v.status === f.status));
}
const sortVideos = a => [...a].sort((x, y) => (y.created_date || '').localeCompare(x.created_date || '') || (y.created_at || '').localeCompare(x.created_at || ''));
const insMapOf = () => new Map(S.insights.map(i => [i.video_id, i]));
const isLate = (v, m) => v.status === '投稿済' && v.scheduled_date && !m.has(v.id) && daysDiff(v.scheduled_date, todayStr()) >= 7;
const warnList = v => {
  const w = [];
  if (!v.category) w.push('カテゴリが未入力');
  if (!v.storage_url) w.push('格納先URLが未入力');
  if (!v.scheduled_date) w.push('投稿日が未入力');
  if (!v.account_id) w.push('投稿アカウントが未選択');
  if (!v.post_url) w.push('投稿URLが未入力');
  return w;
};
const stHtml = s => `<span class="st"><i class="dot" style="background:${STATUS_COLOR[s] || '#888'}"></i>${esc(s)}</span>`;
function insBtn(v, m) {
  if (m.has(v.id)) return `<button class="ins done" data-act="insight" data-vid="${v.id}">✅ 集計済み</button>`;
  if (isLate(v, m)) return `<button class="ins late" data-act="insight" data-vid="${v.id}" title="投稿から7日以上経過">📊 要集計</button>`;
  return `<button class="ins" data-act="insight" data-vid="${v.id}" title="インサイトを入力">📊</button>`;
}
function vFilters() {
  const f = ui.vf, any = f.category || f.account || f.status;
  return `<div class="filters">
    <select data-vf="category" aria-label="カテゴリ"><option value="">カテゴリ：すべて</option>${allCategories().map(c => `<option ${f.category === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <select data-vf="account" aria-label="アカウント"><option value="">アカウント：すべて</option><option value="none" ${f.account === 'none' ? 'selected' : ''}>未定</option>${S.accounts.map(a => `<option value="${a.id}" ${f.account === a.id ? 'selected' : ''}>${esc(a.platform)}｜${esc(a.name)}</option>`).join('')}</select>
    <select data-vf="status" aria-label="ステータス"><option value="">ステータス：すべて</option>${STATUSES.map(s => `<option ${f.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select>
    ${any ? '<button class="btn ghost sm" data-act="clearVf">絞り込み解除</button>' : ''}</div>`;
}
ACT.clearVf = () => { ui.vf = {category:'', account:'', status:''}; renderPage(); };
ACT.vtab = d => { ui.vTab = d.t; renderPage(); };

function pageVideos() {
  const tabs = `<div class="tabs"><button class="${ui.vTab === 'list' ? 'on' : ''}" data-act="vtab" data-t="list">リスト表示</button><button class="${ui.vTab === 'cal' ? 'on' : ''}" data-act="vtab" data-t="cal">カレンダー表示</button></div>`;
  return `<div class="ph"><h1>動画・投稿管理</h1><div class="phr">${tabs}<button class="btn pri" data-act="newVideo">＋ 動画を追加</button></div></div>
    ${vFilters()}${ui.vTab === 'list' ? videoList() : videoCalendar()}`;
}
function videoList() {
  const m = insMapOf(), list = sortVideos(filteredVideos());
  if (!list.length) return empty(S.videos.length ? '条件に合う動画がありません。' : 'まだ動画がありません。「＋ 動画を追加」から登録してください。');
  const rows = list.map(v => {
    const a = accOf(v.account_id), w = warnList(v), late = isLate(v, m), ins = m.get(v.id);
    const thumb = v.thumbnail
      ? `<img class="vthumb" src="${esc(v.thumbnail)}" alt="サムネ">`
      : `<div class="vthumb-ph">🎬</div>`;
    const stats = ins
      ? `<div class="istats">
          <div class="istat"><b>${ins.plays !== null && ins.plays !== undefined ? Number(ins.plays).toLocaleString() : '—'}</b><small>再生数</small></div>
          <div class="istat"><b>${ins.likes !== null && ins.likes !== undefined ? Number(ins.likes).toLocaleString() : '—'}</b><small>いいね</small></div>
          <div class="istat"><b>${ins.follower_diff !== null && ins.follower_diff !== undefined ? (ins.follower_diff > 0 ? '+' : '') + ins.follower_diff : '—'}</b><small>フォロワー増減</small></div>
        </div>`
      : `<div class="istats"><div class="istat" style="color:var(--sub)"><b style="font-size:14px">未集計</b></div></div>`;
    return `<div class="vcard${late ? ' late' : ''}" style="--acc:${esc(a ? a.color : '#888')}" data-act="viewVideo" data-id="${v.id}" tabindex="0" role="button">
      ${thumb}
      <div class="vleft">
        <div class="vtitle">${esc((v.title || '').split('\n')[0]) || '（タイトル未入力）'}${w.length ? ` <span class="warnic" title="${esc(w.join(' / '))}">⚠</span>` : ''}</div>
        <div class="vmeta">
          ${v.category ? `<span class="vtag">${esc(v.category)}</span>` : ''}
          ${a ? `<span class="st"><i class="dot" style="background:${esc(a.color)}"></i>${esc(a.name)}</span>` : '<span style="color:var(--sub)">アカウント未定</span>'}
          ${v.scheduled_date ? `<span style="font-weight:700">${esc(fmtDate(v.scheduled_date))}</span>` : '<span style="color:var(--sub)">投稿日未定</span>'}
          ${stHtml(v.status)}
        </div>
        ${w.length ? `<div class="wtxt">⚠ ${esc(w.join('・'))}</div>` : ''}
      </div>
      <div class="vright">
        ${stats}
        ${insBtn(v, m)}
      </div>
    </div>`;
  }).join('');
  return `<p class="count">${list.length}件</p><div class="tbl">${rows}</div>`;
}
function videoCalendar() {
  const {y, m} = ui.vcal, vids = filteredVideos(), by = {};
  vids.filter(v => v.scheduled_date).forEach(v => (by[v.scheduled_date] = by[v.scheduled_date] || []).push(v));
  Object.values(by).forEach(a => a.sort((p, r) => (p.scheduled_time || '').localeCompare(r.scheduled_time || '')));
  const unsched = vids.filter(v => !v.scheduled_date).length, t = todayStr();
  const cells = monthGrid(y, m).map((ds, i) => {
    if (!ds) return '<div class="day blank"></div>';
    const items = by[ds] || [];
    const chips = items.slice(0, 3).map(v => {
      const a = accOf(v.account_id);
      return `<div class="chip${v.status === 'ボツ' ? ' dead' : ''}" style="background:${esc(a ? a.color : '#5B5672')}">${v.status === '投稿完了' ? '✓ ' : ''}${v.scheduled_time ? esc(hhmm(v.scheduled_time)) + ' ' : ''}${esc(v.title || '（無題）')}</div>`;
    }).join('');
    return `<div class="day${ds === t ? ' today' : ''}" data-act="dayVideos" data-date="${ds}" tabindex="0" role="button" aria-label="${esc(dateLabel(ds))}"><div class="dnum ${dnumCls(i)}">${+ds.slice(8)}</div>${chips}${items.length > 3 ? `<div class="more">ほか${items.length - 3}件</div>` : ''}</div>`;
  }).join('');
  const legend = S.accounts.map(a => `<span><i class="dot" style="background:${esc(a.color)}"></i>${esc(a.name)}</span>`).join('') + '<span><i class="dot" style="background:#5B5672"></i>アカウント未定</span>';
  return `<div class="cal">${calHead('v', y, m)}${DOW_HTML}<div class="days">${cells}</div>
    <div class="legend">${legend}</div>
    ${unsched ? `<p class="sub">投稿予定日が未設定の動画：${unsched}件（リスト表示で確認できます）</p>` : ''}</div>`;
}

  const m = insMapOf(), items = filteredVideos().filter(v => v.scheduled_date === date).sort((a, b) => (a.scheduled_time || '').localeCompare(b.scheduled_time || ''));
  const body = items.length ? items.map(v => {
    const a = accOf(v.account_id);
    return `<div class="lrow"><div class="lmain" data-act="viewVideo" data-id="${v.id}" style="cursor:pointer" tabindex="0" role="button">
      <b>${v.scheduled_time ? esc(hhmm(v.scheduled_time)) + '　' : ''}${esc(v.title || '（無題）')}</b>
      <span class="sub">${a ? `<i class="dot" style="background:${esc(a.color)}"></i> ${esc(a.name)}` : 'アカウント未定'}　${stHtml(v.status)}</span></div>
      <div class="lbtn">${insBtn(v, m)}</div></div>`;
  }).join('') : '<p class="empty">この日の投稿予定はありません。</p>';
  return `<div class="mh"><h2>${esc(dateLabel(date))}の投稿</h2><button class="x" data-act="close" aria-label="閉じる">✕</button></div>${body}
    <div class="mf"><button class="btn pri" data-act="newVideo" data-date="${date}">＋ この日に動画を追加</button><button class="btn ghost" data-act="close">閉じる</button></div>`;
}
ACT.dayVideos = d => openModal(() => dayVideosHtml(d.date), {live: true});

  const a = accOf(v.account_id), m = insMapOf();
  const row = (label, val) => `<div class="f"><div class="lab">${label}</div><div class="dval">${val || '（未入力）'}</div></div>`;
  const linkRow = (label, url) => `<div class="f"><div class="lab">${label}</div><div class="dval">${url ? `<a class="dlink" href="${esc(safeUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(url)} ↗</a>` : '（未入力）'}</div></div>`;
  return `<div class="mh"><h2>${esc((v.title || '').split('\n')[0] || '（タイトル未入力）')}</h2><button type="button" class="x" data-act="close" aria-label="閉じる">✕</button></div>
    ${v.thumbnail ? `<div class="thumb-wrap"><img src="${esc(v.thumbnail)}" alt="サムネ"></div>` : ''}
    <div style="margin-bottom:14px">${stHtml(v.status)}${a ? `　<span class="st"><i class="dot" style="background:${esc(a.color)}"></i>${esc(a.name)}</span>` : '　アカウント未定'}</div>
    <div class="fgrid">
      ${row('カテゴリ', esc(v.category))}
      ${row('制作日', v.created_date ? esc(fmtDate(v.created_date)) : null)}
      ${row('投稿日', v.scheduled_date ? esc(fmtDate(v.scheduled_date)) + (v.scheduled_time ? '　' + esc(hhmm(v.scheduled_time)) : '') : null)}
      <div class="f full"><div class="lab">サムネタイトル</div><div class="dval">${v.title ? esc(v.title.split('\n')[0]) : '（未入力）'}</div></div>

      <div class="f full"><div class="lab">シーン・切り抜き箇所</div><div class="dval">${v.notes ? esc(v.notes).replace(/\n/g,'<br>') : '（未入力）'}</div></div>
      ${linkRow('格納先URL', v.storage_url)}
      ${linkRow('投稿URL', v.post_url)}
    </div>
    <div class="mf"><div class="grp">${insBtn(v, m)}<button type="button" class="btn ghost" data-act="close">閉じる</button></div>

ACT.viewVideo = d => openModal(() => videoDetailHtml(d.id), {wide: true});
ACT.catSelChange = (d, el) => {
  const form = el.closest('form');
  const other = form.querySelector('#catother');
  const hidden = form.elements.category;
  if (el.value === 'その他') {
    other.style.display = 'block'; other.focus();
    hidden.value = other.value || '';
  } else {
    other.style.display = 'none';
    hidden.value = el.value;
  }
};
document.addEventListener('input', e => {
  const t = e.target;
  if (t.name === 'category_other') {
    const hidden = t.closest('form').elements.category;
    if (hidden) hidden.value = t.value;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'thumbFile' && e.target.files[0]) setThumbPreview(e.target.files[0], e.target.closest('form'));
}, true);
document.addEventListener('dragover', e => { if (e.target.closest('#thumbDrop')) e.preventDefault(); });
document.addEventListener('dragenter', e => { const d = e.target.closest('#thumbDrop'); if (d) d.classList.add('drag'); });
document.addEventListener('dragleave', e => { const d = e.target.closest('#thumbDrop'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('drag'); });
document.addEventListener('drop', e => {
  const d = e.target.closest('#thumbDrop'); if (!d) return;
  e.preventDefault(); d.classList.remove('drag');
  const file = e.dataTransfer.files[0]; if (file && file.type.startsWith('image/')) setThumbPreview(file, d.closest('form'));
});
function setThumbPreview(file, form) {
  if (!form) return;
  const r = new FileReader();
  r.onload = ev => {
    form.elements.thumbnail.value = ev.target.result;
    const lbl = form.querySelector('#thumbLabel');
    if (lbl) { lbl.innerHTML = `<img src="${esc(ev.target.result)}" style="max-height:160px;border-radius:8px;object-fit:contain">`; }
  };
  r.readAsDataURL(file);
}
ACT.clearThumb = (d, el) => {
  const form = el.closest('form');
  if (form.elements.thumbnail) form.elements.thumbnail.value = '';
  const wrap = el.closest('.thumb-wrap'); if (wrap) wrap.remove();
};
ACT.newVideo = d => openModal(() => videoForm(null, {date: d.date}));
ACT.editVideo = d => openModal(() => videoForm(d.id));
SUB.video = async (f, form) => {
  const id = form.dataset.id;
  // サムネ画像処理
  const fileInput = form.querySelector('#thumbFile');
  if (fileInput && fileInput.files && fileInput.files[0]) {
    const file = fileInput.files[0];
    if (file.size > 2 * 1024 * 1024) return toast('画像は2MB以下にしてください', true);
    f.thumbnail = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = e => res(e.target.result); r.onerror = rej; r.readAsDataURL(file);
    });
  }
  // カテゴリ：「その他」選択時は自由入力欄の値を使う
  const catSel = (f.category_sel || '').trim();
  const catOther = (f.category_other || '').trim();
  const category = nn(catSel === 'その他' ? catOther : catSel) || nn(f.category);
  const rec = {
    created_date: nn(f.created_date),
    category,
    title: nn(f.title),
    subtitle: nn(f.subtitle),
    storage_url: normUrl(f.storage_url),
    account_id: nn(f.account_id),
    scheduled_date: nn(f.scheduled_date),
    scheduled_time: nn(f.scheduled_time),
    post_url: normUrl(f.post_url),
    status: f.status || '編集中',
    notes: nn(f.notes),
    thumbnail: nn(f.thumbnail)
  };
  // 未入力チェック（警告のみ・保存は通す）
  const missing = [];
  if (!rec.category) missing.push('カテゴリ');
  if (!rec.storage_url) missing.push('格納先URL');
  if (!rec.scheduled_date) missing.push('投稿日');
  if (!rec.account_id) missing.push('投稿アカウント');
  if (!rec.post_url) missing.push('投稿URL');
  if (!rec.subtitle) missing.push('投稿文');
  if (!rec.notes) missing.push('シーン・切り抜き箇所');
  if (id) await q(db.from('videos').update(rec).eq('id', id)); else await q(db.from('videos').insert(rec));
  closeModal(); await reload(['videos']);
  if (missing.length) { toast(`保存しました（未入力：${missing.join('・')}）`); } else { toast('保存しました'); }
};
ACT.delVideo = async d => {
  const v = S.videos.find(x => x.id === d.id), n = S.insights.filter(i => i.video_id === d.id).length;
  if (!await confirmDialog(`「${v.title || '（無題）'}」を削除しますか？${n ? '\n紐づくインサイトも一緒に削除されます。' : ''}\nこの操作は元に戻せません。`)) return;
  await q(db.from('insights').delete().eq('video_id', d.id));
  await q(db.from('videos').delete().eq('id', d.id));
  closeModal(); await reload(['videos', 'insights']); toast('削除しました');
};

const internOf = id => S.interns.find(i => i.id === id);
function pageWork() {
  const {y, m} = ui.wcal, vis = S.schedules.filter(s => !ui.wf || s.intern_id === ui.wf), by = {};
  vis.forEach(s => (by[s.work_date] = by[s.work_date] || []).push(s));
  Object.values(by).forEach(a => a.sort((p, r) => (p.start_time || '').localeCompare(r.start_time || '')));
  const t = todayStr();
  const cells = monthGrid(y, m).map((ds, i) => {
    if (!ds) return '<div class="day blank"></div>';
    const items = by[ds] || [];

function pageInsights() {
  const m = insMapOf();

  rows = [...rows].sort((a, b) => (isLate(b, m) - isLate(a, m)) || (b.scheduled_date || '').localeCompare(a.scheduled_date || ''));
  const body = rows.map(v => {
    const i = m.get(v.id), a = accOf(v.account_id), lt = isLate(v, m), due = v.scheduled_date ? addDays(v.scheduled_date, 7) : '';
    const num = k => i && i[k] !== null && i[k] !== undefined ? Number(i[k]).toLocaleString() : '—';

    return `<div class="irow${lt ? ' late' : ''}" data-act="insight" data-vid="${v.id}" tabindex="0" role="button">

      <div data-l="投稿日">${v.scheduled_date ? esc(fmtDate(v.scheduled_date)) : '未設定'}${due ? `<span class="sub"> 集計目安 ${esc(fmtDate(due))}</span>` : ''}</div>
      <div data-l="状況">${i ? `<span class="donetxt">✅ 集計済み${i.collected_date ? '（' + esc(fmtDate(i.collected_date)) + '）' : ''}</span>` : lt ? `<span class="latetxt">⚠ 未集計・${daysDiff(v.scheduled_date, todayStr()) - 7}日超過</span>` : '未集計'}</div>
      <div data-l="再生">${num('plays')}</div><div data-l="いいね">${num('likes')}</div><div data-l="コメント">${num('comments')}</div><div data-l="保存">${num('saves')}</div>

      <label class="chk"><input type="checkbox" data-ins="pending" ${ui.insPending ? 'checked' : ''}>未集計のみ表示</label>
      <select data-ins="account" aria-label="アカウント"><option value="">アカウント：すべて</option>${S.accounts.map(a => `<option value="${a.id}" ${ui.insAccount === a.id ? 'selected' : ''}>${esc(a.platform)}｜${esc(a.name)}</option>`).join('')}</select></div>
    ${rows.length ? `<div class="tbl"><div class="ihead"><div>動画</div><div>投稿日</div><div>状況</div><div>再生</div><div>いいね</div><div>コメント</div><div>保存</div><div>フォロワー増減</div><div></div></div>${body}</div>`
      : empty(eligible.length ? '条件に合う動画がありません。' : '「投稿完了」の動画がまだありません。投稿後1週間でインサイトを集計します。')}
    <p class="sub" style="margin-top:12px">集計は投稿の1週間後に行います。投稿日は動画の「投稿予定日」を基準にしています。</p>`;

};

const WORK_TYPES = ['切り抜き作業','投稿作業','入力作業（アプリ登録）','インサイト集計','キャプション作成','サムネイル作成','その他'];
const KIRI_CATS = ['渋スト','ASMR','希空ch'];
// PostgreSQL は引用符なしで作成したカラム名の英大文字を小文字化する。
// フォームの表示名 ASMR はそのままにし、DB の実カラム *_asmr を参照する。
const reportColumn = (prefix, category) => `${prefix}_${category === 'ASMR' ? 'asmr' : category}`;

// 作業と内訳は同じ行のまとまりにし、旧報告で合計だけ残る場合も表示する。
function reportWorkLines(r) {
  const stored = (r.work_types || '').split(',').filter(Boolean);
  const counts = {
    '切り抜き作業': ['kiri', 'count_make', '本'],
    '投稿作業': ['post', 'count_post', '本'],
    'キャプション作成': ['caption', 'count_caption', '本'],
    'サムネイル作成': ['thumb', null, '枚']
  };
  const types = [...new Set([...WORK_TYPES.filter(t => stored.includes(t)), ...stored.filter(t => !WORK_TYPES.includes(t))])];
  Object.entries(counts).forEach(([type, [prefix, totalKey]]) => {
    if (!types.includes(type) && (KIRI_CATS.some(c => r[reportColumn(prefix,c)] != null) || (totalKey && r[totalKey] != null))) types.push(type);
  });
  if (r.other_detail && !types.includes('その他')) types.push('その他');
  if (!types.length) return '<li>・作業内容の記録なし</li>';
  return types.map(type => {
    const spec = counts[type];
    if (spec) {
      const [prefix, totalKey, unit] = spec;
      const values = KIRI_CATS.map(c => ({name:c, value:r[reportColumn(prefix,c)]}));
      const hasCategories = values.some(v => v.value != null);
      const hasTotal = totalKey && r[totalKey] != null;
      const total = hasCategories ? values.reduce((n,v) => n + (Number(v.value) || 0), 0) : r[totalKey];
      const detailItems = values.filter(v => Number(v.value) > 0);
      const detail = detailItems.map(v => `<li>└ ${esc(v.name)}：${esc(v.value)}${unit}</li>`).join('');
      const heading = detailItems.length > 1 ? `：合計${esc(total)}${unit}` :
        detailItems.length === 0 && hasTotal && Number(total) > 0 ? `：${esc(total)}${unit}` : '';
      return `<li>・${esc(type)}${heading}${detail ? `<ul class="rm-breakdown">${detail}</ul>` : ''}</li>`;
    }
    return `<li>・${esc(type)}${type === 'その他' && r.other_detail ? `：${esc(r.other_detail)}` : ''}</li>`;
  }).join('');
}
const displayStaffName = it => it ? `${it.name.trim()}${it.name.trim().endsWith('さん') ? '' : 'さん'}` : '（削除済み）';
const reportTimeLabel = r => r.start_time || r.end_time ?
  `　${esc((r.start_time || '—').slice(0,5))}〜${esc((r.end_time || '—').slice(0,5))}` : '';
const categoryGoals = (month, metric) => S.report_goal_categories.filter(g => g.month === month && g.metric === metric);
function monthGoal(month, metric) {
  const rows = categoryGoals(month, metric);
  if (rows.length) return rows.some(g => g.target != null) ? rows.reduce((sum,g) => sum + (Number(g.target) || 0), 0) : null;
  return S.report_goals.find(g => g.month === month && g.metric === metric)?.target ?? null;
}
function reportProgress(label, actual, target, month, metric, monthRows) {
  const valid = Number.isFinite(Number(target)) && Number(target) > 0;
  const rate = valid ? Math.round(actual / Number(target) * 100) : null;
  const width = valid ? Math.min(rate, 100) : 0;
  const prefix = metric === 'make' ? 'kiri' : 'post';
  const catRows = categoryGoals(month, metric);
  const detail = KIRI_CATS.map(c => {
    const count = monthRows.reduce((sum,r) => sum + (Number(r[reportColumn(prefix,c)]) || 0), 0);
    const goal = catRows.find(g => g.category === c)?.target;
    const hasGoal = Number(goal) > 0;
    const pct = hasGoal ? `　${Math.round(count / Number(goal) * 100)}%` : '';
    return `<li>${esc(c)}　${count} / ${hasGoal ? `${goal}本` : '目標未設定'}${pct}</li>`;
  }).join('');
  return `<div class="report-goal"><b>${label}</b>
    <div>${actual}本 / 目標 ${valid ? `${target}本` : '未設定'}　${valid ? `達成率 ${rate}%` : ''}</div>
    <div class="report-progress-track" role="progressbar" aria-label="${label}の達成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${width}" aria-valuetext="${valid ? `${rate}%` : '目標未設定'}"><div class="report-progress-fill" style="width:${width}%"></div></div>
    <details class="report-breakdown"><summary>カテゴリ別の進捗を見る</summary><ul>${detail}</ul></details>
  </div>`;
}
function goalEditorGroup(month, metric, label) {
  const rows = categoryGoals(month, metric);
  const initial = rows.some(g => g.target != null) ? rows.reduce((n,g) => n + (Number(g.target) || 0),0) : null;
  const legacy = rows.length ? '' : S.report_goals.find(g => g.month === month && g.metric === metric)?.target;
  return `<div class="goal-editor-group"><b>${label}</b>
    ${legacy ? `<p class="sub">以前の合計目標：${legacy}本。カテゴリ別に保存すると切り替わります。</p>` : ''}
    ${KIRI_CATS.map(c => `<label class="work-count-row"><span>${esc(c)}</span><input type="number" inputmode="numeric" min="1" step="1" name="${metric}_${c}" value="${esc(rows.find(g => g.category === c)?.target ?? '')}" placeholder="未設定"><span>本</span></label>`).join('')}
    <div class="goal-editor-total">合計目標：<strong data-goal-total="${metric}">${initial == null ? '未設定' : `${initial}本`}</strong></div>
    ${legacy ? `<label class="sub"><input type="checkbox" name="clear_${metric}"> 以前の合計目標を未設定にする（カテゴリ欄が空のときのみ）</label>` : ''}
  </div>`;
}

SUB.reportGoals = async (f, form) => {
  const month = form.dataset.month;
  if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('対象月が正しくありません');
  const rows = ['make', 'post'].flatMap(metric => {
    const hasLegacyOnly = !categoryGoals(month, metric).length && S.report_goals.some(g => g.month === month && g.metric === metric && g.target != null);
    const values = KIRI_CATS.map(category => ({category, raw: (f[`${metric}_${category}`] || '').trim()}));
    // 未入力の旧合計目標はそのまま残す。入力済みのカテゴリだけ新方式に切り替える。
    if (hasLegacyOnly && values.every(v => v.raw === '') && !f[`clear_${metric}`]) return [];
    return values.map(({category, raw}) => {
      const target = raw === '' ? null : Number(raw);
      if (target !== null && (!Number.isSafeInteger(target) || target <= 0)) throw new Error('目標本数は1以上の整数で入力してください');
      return {month, metric, category, target};
    });
  });
  if (!rows.length) return toast('カテゴリ別の目標を入力してください', true);
  await q(db.from('report_goal_categories').upsert(rows, {onConflict:'month,metric,category'}));
  await reload(['report_goal_categories']);
  toast('カテゴリ別の月間目標を保存しました');
};

      ${(r.work_types||'').split(',').includes('サムネイル作成') ? `<div class="f full"><div class="lab">🖼️ サムネイル作成枚数（カテゴリ別）</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
          ${KIRI_CATS.map(c => `<div class="rnum"><b>${r[reportColumn('thumb', c)] ?? 0}</b><small>${esc(c)}（枚）</small></div>`).join('')}
          <div class="rnum" style="background:#E6E4F2"><b>${KIRI_CATS.reduce((n,c) => n + (r[reportColumn('thumb', c)] || 0), 0)}</b><small>合計（枚）</small></div>
        </div>
      </div>` : ''}
      ${r.other_detail ? `<div class="f full"><div class="lab">その他の作業内容</div><div class="dval">${esc(r.other_detail)}</div></div>` : ''}
      <div class="f full"><div class="lab">ひとことメモ</div><div class="dval">${r.memo ? esc(r.memo) : '（なし）'}</div></div>
    </div>
    <div class="mf end">
      <button type="button" class="btn ghost" data-act="close">閉じる</button>
      <button type="button" class="btn pri" data-act="editReport" data-id="${id}">編集する</button>
    </div>`;
}

ACT.workTypeChk = (d, el) => {
  const card = el.closest('.work-card');
  if (card) card.classList.toggle('open', el.checked);
};
// 切り抜き本数入力 → キャプション欄へ自動コピー（未入力のときだけ）
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.name || !t.name.startsWith('kiri_')) return;
  const cat = t.name.slice(5); // 例: 渋スト
  const form = t.closest('form'); if (!form) return;
  const capEl = form.querySelector(`input[name="caption_${cat}"]`);
  // キャプション欄が空か、前回の切り抜き値と同じなら上書き
  if (capEl && (capEl.value === '' || capEl.dataset.autoFilled === 'true')) {
    capEl.value = t.value;
    capEl.dataset.autoFilled = 'true';
  }
});
// キャプション欄を手入力したら自動フィルフラグを外す
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.name || !t.name.startsWith('caption_')) return;
  const form = t.closest('form'); if (!form) return;
  // 対応するkirinuki値と違ったら手入力とみなす
  const cat = t.name.slice(8);
  const kiriEl = form.querySelector(`input[name="kiri_${cat}"]`);
  if (kiriEl && t.value !== kiriEl.value) t.dataset.autoFilled = 'false';
  else t.dataset.autoFilled = 'true';
});
// 目標入力中も合計を即時反映する（保存はボタン押下時のみ）
document.addEventListener('input', e => {
  const t = e.target;
  const form = t.closest?.('form[data-submit="reportGoals"]');
  if (!form || !/^(make|post)_/.test(t.name || '')) return;
  const metric = t.name.split('_')[0];
  const values = KIRI_CATS.map(c => form.elements.namedItem(`${metric}_${c}`)?.value ?? '');
  const total = form.querySelector(`[data-goal-total="${metric}"]`);
  if (total) total.textContent = values.some(v => v !== '') ? `${values.reduce((sum,v) => sum + (Number(v) || 0),0)}本` : '未設定';
});
ACT.newReport = () => {
  if (!S.interns.length) { toast('先にインターンを登録してください（稼働カレンダー→インターン管理）', true); return; }
  openModal(() => reportForm(null));
};
ACT.editReport = d => openModal(() => reportForm(d.id));
ACT.viewReport = d => openModal(() => reportDetailHtml(d.id));

SUB.report = async (f, form) => {
  const id = form.dataset.id;
  if (!f.intern_id || !f.report_date) return toast('名前と日付は必須です', true);
  const types = [...form.querySelectorAll('input[name=work_types]:checked')].map(el => el.value)
    .concat((f.legacy_work_types || '').split(',').filter(Boolean)).join(',');
  // カテゴリ別本数
  const kiriData = {}, postData = {}, captionData = {}, thumbData = {};
  KIRI_CATS.forEach(c => {
    kiriData[reportColumn('kiri', c)] = numOrNull(f['kiri_' + c]);
    postData[reportColumn('post', c)] = numOrNull(f['post_' + c]);
    captionData[reportColumn('caption', c)] = numOrNull(f['caption_' + c]);
    thumbData[reportColumn('thumb', c)] = types.split(',').includes('サムネイル作成') ? numOrNull(f['thumb_' + c]) : null;
  });
  // 各合計
  const count_make    = KIRI_CATS.reduce((s,c) => s + (kiriData[reportColumn('kiri', c)]    || 0), 0) || null;
  const count_post    = KIRI_CATS.reduce((s,c) => s + (postData[reportColumn('post', c)]    || 0), 0) || null;
  const count_caption = KIRI_CATS.reduce((s,c) => s + (captionData[reportColumn('caption', c)] || 0), 0) || null;
  const rec = {
    intern_id: f.intern_id,
    report_date: f.report_date,
    start_time: nn(f.start_time),
    end_time: nn(f.end_time),
    work_types: types || null,
    count_make,
    count_post,
    count_caption,
    other_detail: nn(f.other_detail),
    memo: nn(f.memo),
    ...kiriData, ...postData, ...captionData, ...thumbData
  };
  if (id) await q(db.from('reports').update(rec).eq('id', id));
  else await q(db.from('reports').insert(rec));
  closeModal(); await reload(['reports']); toast('報告しました！');
};

ACT.delReport = async d => {
  const r = S.reports.find(x => x.id === d.id), it = internOf(r.intern_id);
  if (!await confirmDialog(`${displayStaffName(it)}の${fmtDate(r.report_date)}の報告を削除しますか？`)) return;
  await q(db.from('reports').delete().eq('id', d.id));
  closeModal(); await reload(['reports']); toast('削除しました');
};

async function boot() {
  const url = localStorage.getItem(LS_URL), key = localStorage.getItem(LS_KEY);
  if (!url || !key) return showSetup();
  if (!window.supabase) return showSetup('Supabase ライブラリを読み込めませんでした。ネットワーク接続を確認して再読み込みしてください。');
  db = window.supabase.createClient(url, key);
  try {
    await loadAll();
    if (!S.accounts.length) { await q(db.from('accounts').insert(SEED_ACCOUNTS)); await load('accounts'); }
    await autoPromoteScheduled();
  } catch (e) {
    console.error(e);
    return showSetup('データを読み込めませんでした：' + (e.message || e) + '\nテーブル作成のSQLを実行済みか、URLとキーが正しいかご確認ください。');
  }
  const h = location.hash.slice(1); if (PAGES.some(p => p.id === h)) ui.page = h;
  renderShell(); renderPage();
}
boot();
</script>
